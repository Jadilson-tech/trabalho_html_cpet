<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto HTML5 Multimídia</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
        }

        section {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 10px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        /* Estilização para alinhar o range e seu respectivo valor */
        .range-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .range-container input {
            flex: 1;
            margin-bottom: 0;
        }

        output {
            font-weight: bold;
            color: #0077cc;
            font-size: 16px;
        }

        button {
            padding: 12px;
            background-color: #0077cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #005599;
        }

        figure {
            text-align: center;
            margin: 20px 0 0 0;
        }

        img {
            max-width: 100%;
            width: 450px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        figcaption {
            margin-top: 10px;
            font-style: italic;
            color: #555;
        }

        video {
            display: block;
            margin: auto;
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
            background-color: #000;
        }
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Recursos Multimídia do HTML5</h1>
    </header>

    <main>
        <section>
            <h2>Vídeo Explicativo</h2>
            <video width="450" controls poster="imagem.jpg" preload="metadata">
                <source src="video.mp4" type="video/mp4">
                Seu navegador não suporta a reprodução de vídeos nativos.
            </video>
        </section>

        <section>
            <h2>Formulário Moderno</h2>
            <form action="#" method="POST">

                <label for="txt-email">Email:</label>
                <input type="email" id="txt-email" placeholder="Digite seu email" required>

                <label for="txt-data">Data de nascimento:</label>
                <input type="date" id="txt-data" required>

                <label for="txt-idade">Idade:</label>
                <input type="number" id="txt-idade" min="0" max="120" placeholder="Ex: 25">

                <label for="txt-satisfacao">Nível de satisfação:</label>
                <div class="range-container">
                    <input type="range" id="txt-satisfacao" min="0" max="10" value="5" oninput="lblValor.value = this.value">
                    <output id="lblValor">5</output>
                </div>

                <button type="submit">Enviar Dados</button>
            </form>
        </section>

        <section>
            <h2>Galeria de Imagem</h2>
            <figure>
                <img src="imagem.jpg" alt="Ilustração de checagem de tarefas e metas corporativas">
                <figcaption>
                    Exemplo de imagem integrada utilizando as tags semânticas &lt;figure&gt; e &lt;figcaption&gt; do HTML5.
                </figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>&copy; 16/05/2026 - Desenvolvido por Jadilson José Tavares | Atividade Prática de HTML5 Multimídia</p>
    </footer>

</body>

</html>
